server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Trust Coolify / Traefik proxy headers
    real_ip_header X-Forwarded-For;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;

    # Segurança e SEO
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    gzip on;
    gzip_types text/plain text/css text/xml application/javascript application/json application/xml image/svg+xml application/manifest+json;
    gzip_min_length 256;

    location = /robots.txt {
        default_type text/plain;
        expires 1d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location = /llms.txt {
        default_type text/plain;
        charset utf-8;
        expires 1d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location = /sitemap.xml {
        default_type application/xml;
        expires 1d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location = /site.webmanifest {
        default_type application/manifest+json;
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location = /index.html {
        expires -1;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(css|js|png|jpg|jpeg|gif|svg|webp|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location = /config.json {
        default_type application/json;
        expires -1;
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }
}
